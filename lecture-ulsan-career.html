    <style>
        :root {
            --bg-void: #050811;
            --bg-surface: rgba(15, 23, 42, 0.72);
            --bg-card-minimal: rgba(15, 23, 42, 0.56);
            --border-glass: rgba(255, 255, 255, 0.12);
            --text-main: #F8FAFC;
            --text-sub: #CBD5E1;
            --text-muted: #94A3B8;
            --mod-accent: #10B981;
            --mod-secondary: #38BDF8;
            --ease-cinematic: cubic-bezier(0.16, 1, 0.3, 1);
            --ease-morph: cubic-bezier(0.22, 1, 0.36, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
        html, body {
            width: 100%; height: 100%; overflow: hidden;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-void); color: var(--text-main);
        }

        /* Cinematic Dark Ambient Stage */
        .cinematic-stage-bg {
            position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden;
            background: radial-gradient(circle at 50% 45%, #0B1325 0%, #050811 72%, #020409 100%);
        }
        .ambient-orb {
            position: absolute; border-radius: 50%; filter: blur(130px); opacity: 0.44;
            transition: background 1.2s var(--ease-cinematic), transform 1.2s var(--ease-cinematic);
            will-change: transform, background;
        }
        .orb-1 { width: 700px; height: 700px; top: -230px; left: -170px; background: radial-gradient(circle, #065F46 0%, transparent 70%); }
        .orb-2 { width: 650px; height: 650px; bottom: -230px; right: -170px; background: radial-gradient(circle, #1E3A8A 0%, transparent 70%); }
        .soft-vignette {
            position: fixed; inset: 0; pointer-events: none; z-index: 1;
            background: radial-gradient(ellipse at center, transparent 48%, rgba(2, 4, 9, 0.82) 100%);
        }
        .grid-overlay {
            position: fixed; inset: 0; pointer-events: none; z-index: 1; opacity: 0.04;
            background-image: linear-gradient(rgba(255,255,255,0.4) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.4) 1px, transparent 1px);
            background-size: 64px 64px;
            mask-image: radial-gradient(circle at center, black 35%, transparent 85%);
        }

        /* Top Glass Navbar */
        .top-bar {
            position: fixed; top: 0; left: 0; right: 0; height: 62px; z-index: 100;
            background: rgba(5, 8, 17, 0.8); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
            border-bottom: 1px solid var(--border-glass);
            display: flex; align-items: center; justify-content: space-between; padding: 0 1.3rem; gap: 0.8rem;
        }
        .brand-left { display: flex; align-items: center; gap: 0.7rem; min-width: 0; }
        .back-pill {
            color: var(--text-sub); text-decoration: none; font-size: 0.78rem; font-weight: 700;
            padding: 6px 11px; border-radius: 999px; border: 1px solid var(--border-glass);
            background: rgba(255,255,255,0.04); display: inline-flex; align-items: center; gap: 6px;
            transition: all 0.2s ease; white-space: nowrap;
        }
        .back-pill:hover { background: rgba(255,255,255,0.12); color: #fff; }
        .deck-label { font-size: 0.83rem; font-weight: 800; letter-spacing: -0.02em; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .deck-label span { color: var(--mod-accent); }

        .module-tabs { display: flex; align-items: center; gap: 5px; background: rgba(255,255,255,0.04); padding: 4px; border-radius: 999px; border: 1px solid var(--border-glass); }
        .mod-tab {
            border: none; background: transparent; color: var(--text-muted); font-family: inherit;
            font-size: 0.76rem; font-weight: 700; padding: 6px 12px; border-radius: 999px; cursor: pointer;
            transition: all 0.25s var(--ease-cinematic); white-space: nowrap;
        }
        .mod-tab:hover { color: #fff; }
        .mod-tab.active { background: var(--mod-accent); color: #030712; box-shadow: 0 0 18px color-mix(in srgb, var(--mod-accent) 45%, transparent); }

        .top-controls { display: flex; align-items: center; gap: 7px; }
        .mode-pill {
            border: 1px solid color-mix(in srgb, var(--mod-accent) 50%, transparent);
            background: color-mix(in srgb, var(--mod-accent) 14%, transparent);
            color: var(--mod-accent); font-family: inherit; font-size: 0.74rem; font-weight: 800;
            padding: 6px 11px; border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; gap: 5px;
            transition: all 0.2s; white-space: nowrap;
        }
        .mode-pill:hover { background: var(--mod-accent); color: #030712; }
        .timer-chip {
            font-family: 'JetBrains Mono', monospace; font-size: 0.78rem; font-weight: 700;
            padding: 5px 10px; border-radius: 8px; border: 1px solid var(--border-glass);
            background: rgba(255,255,255,0.04); color: var(--text-sub); cursor: pointer;
            display: inline-flex; align-items: center; gap: 5px;
        }
        .timer-chip.running { border-color: var(--mod-accent); color: var(--mod-accent); }
        .icon-btn {
            width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--border-glass);
            background: rgba(255,255,255,0.04); color: var(--text-sub); cursor: pointer;
            display: inline-flex; align-items: center; justify-content: center; transition: all 0.2s;
        }
        .icon-btn:hover, .icon-btn.active { background: rgba(255,255,255,0.14); color: #fff; border-color: var(--mod-accent); }

        /* Main Slide Viewport with Depth-of-Field Blur on Spotlight */
        .stage-viewport {
            position: fixed; top: 62px; bottom: 56px; left: 0; right: 0; z-index: 10;
            display: flex; align-items: center; justify-content: center;
            padding: clamp(1rem, 2.5vw, 2.2rem) clamp(1.2rem, 4vw, 4rem);
            perspective: 1400px; overflow: hidden;
            transition: filter 0.55s var(--ease-cinematic), transform 0.55s var(--ease-cinematic), opacity 0.55s var(--ease-cinematic);
        }
        body.spotlight-open .stage-viewport {
            filter: blur(14px) brightness(0.42);
            transform: scale(0.93);
            pointer-events: none;
        }
        .slide-frame {
            width: 100%; max-width: 1240px; height: 100%; max-height: 760px;
            display: flex; flex-direction: column; justify-content: center; position: relative;
            will-change: transform, opacity, filter;
        }

        /* Cinematic Slide Transitions */
        @keyframes enterZoom { from { opacity: 0; transform: scale(1.07) translateY(14px); filter: blur(8px); } to { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); } }
        @keyframes enterMorph { from { opacity: 0; transform: scale(0.96) translateY(18px); filter: blur(4px); } to { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); } }
        @keyframes enterPushRight { from { opacity: 0; transform: translate3d(115px, 0, 0) scale(0.98); } to { opacity: 1; transform: translate3d(0, 0, 0) scale(1); } }
        @keyframes enterPushLeft { from { opacity: 0; transform: translate3d(-115px, 0, 0) scale(0.98); } to { opacity: 1; transform: translate3d(0, 0, 0) scale(1); } }
        @keyframes enterSplit { from { opacity: 0; clip-path: inset(0 48% 0 48%); } to { opacity: 1; clip-path: inset(0 0 0 0); } }
        .anim-zoom { animation: enterZoom 0.78s var(--ease-cinematic) both; }
        .anim-morph { animation: enterMorph 0.72s var(--ease-morph) both; }
        .anim-push-next { animation: enterPushRight 0.72s var(--ease-cinematic) both; }
        .anim-push-prev { animation: enterPushLeft 0.72s var(--ease-cinematic) both; }
        .anim-split { animation: enterSplit 0.78s var(--ease-cinematic) both; }

        .stagger-item { opacity: 0; transform: translateY(18px); animation: staggerUp 0.62s var(--ease-cinematic) forwards; }
        @keyframes staggerUp { to { opacity: 1; transform: translateY(0); } }

        /* Typography & Gradients */
        .slide-top-meta { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 0.9rem; flex-wrap: wrap; }
        .slide-badge {
            display: inline-flex; align-items: center; gap: 8px; padding: 5px 14px; border-radius: 999px;
            font-size: 0.77rem; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase;
            background: color-mix(in srgb, var(--mod-accent) 16%, transparent);
            color: var(--mod-accent); border: 1px solid color-mix(in srgb, var(--mod-accent) 42%, transparent);
        }
        .timeline-pill {
            font-family: 'JetBrains Mono', monospace; font-size: 0.74rem; font-weight: 700;
            color: #94A3B8; background: rgba(255,255,255,0.05); border: 1px solid var(--border-glass);
            padding: 4px 12px; border-radius: 999px; display: inline-flex; align-items: center; gap: 6px;
        }
        .slide-title {
            font-size: clamp(1.8rem, 3.5vw, 2.95rem); font-weight: 900; line-height: 1.22;
            letter-spacing: -0.03em; color: #FFFFFF; margin-bottom: 1.4rem;
        }
        .hero-title { font-size: clamp(2.4rem, 5vw, 4.3rem); line-height: 1.14; margin-bottom: 1.25rem; }
        .grad-emerald { background: linear-gradient(120deg, #34D399, #38BDF8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .grad-cyan { background: linear-gradient(120deg, #38BDF8, #818CF8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .grad-gold { background: linear-gradient(120deg, #FBBF24, #F97316); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .grad-rose { background: linear-gradient(120deg, #FB7185, #F43F5E); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* Interactive Minimal Cards (Progressive Disclosure Tier 1) */
        .glass-card {
            background: var(--bg-surface); border: 1px solid var(--border-glass); border-radius: 20px;
            padding: 1.45rem 1.6rem; backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.36); position: relative; overflow: hidden;
            transition: transform 0.35s var(--ease-cinematic), border-color 0.3s, box-shadow 0.35s, background 0.3s;
        }
        .focusable-card {
            cursor: pointer; user-select: none;
        }
        .focusable-card::after {
            content: ''; position: absolute; inset: 0; opacity: 0; pointer-events: none;
            background: radial-gradient(circle at 50% 0%, color-mix(in srgb, var(--mod-accent) 22%, transparent), transparent 68%);
            transition: opacity 0.35s;
        }
        .focusable-card:hover {
            transform: translateY(-6px) scale(1.018);
            border-color: color-mix(in srgb, var(--mod-accent) 70%, transparent);
            box-shadow: 0 24px 60px rgba(0,0,0,0.5), 0 0 28px color-mix(in srgb, var(--mod-accent) 22%, transparent);
        }
        .focusable-card:hover::after { opacity: 1; }

        .zoom-cue {
            margin-top: 0.9rem; display: inline-flex; align-items: center; gap: 6px;
            font-size: 0.76rem; font-weight: 800; color: var(--mod-accent); opacity: 0.85;
            letter-spacing: 0.02em; transition: transform 0.25s, opacity 0.25s;
        }
        .focusable-card:hover .zoom-cue { transform: translateX(4px); opacity: 1; }

        /* Minimal Mode hides Tier-2 details on initial stage */
        body.minimal-mode .detail-hidden-in-minimal { display: none !important; }
        body.minimal-mode .minimal-card-pad { padding: 2rem 1.7rem; display: flex; flex-direction: column; justify-content: space-between; min-height: 205px; }
        body:not(.minimal-mode) .zoom-cue { opacity: 0.55; }

        .stage-hint-bar {
            margin-top: 1.15rem; text-align: center; font-size: 0.82rem; font-weight: 700;
            color: var(--text-muted); display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .pulse-dot {
            width: 8px; height: 8px; border-radius: 50%; background: var(--mod-accent);
            box-shadow: 0 0 12px var(--mod-accent); animation: pulseBeat 1.8s infinite;
        }
        @keyframes pulseBeat { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.45); opacity: 0.55; } }

        /* Center-Stage FLIP Spotlight Overlay (Tier 2 & Tier 3) */
        .spotlight-overlay {
            position: fixed; inset: 0; z-index: 160; display: none;
            align-items: center; justify-content: center; padding: 4.8rem 1.5rem 5.2rem;
            background: rgba(3, 6, 15, 0.55);
        }
        .spotlight-overlay.open { display: flex; }

        .spotlight-stage {
            width: min(860px, 94vw); max-height: 78vh; overflow-y: auto;
            background: linear-gradient(155deg, rgba(15, 23, 42, 0.96) 0%, rgba(7, 12, 26, 0.98) 100%);
            border: 1.5px solid color-mix(in srgb, var(--mod-accent) 68%, transparent);
            border-radius: 28px; padding: clamp(1.8rem, 3.5vw, 2.8rem);

        .spotlight-close {

            border: 1px solid var(--border-glass); background: rgba(255,255,255,0.06); color: #fff;

        }
        .spotlight-close:hover { background: var(--mod-accent); color: #030712; transform: rotate(90deg); }
        .spotlight-kicker {

            font-size: 0.82rem; font-weight: 800; color: var(--mod-accent);

            border: 1px solid color-mix(in srgb, var(--mod-accent) 42%, transparent);
            padding: 5px 14px; border-radius: 999px; margin-bottom: 1.1rem;
        }
        .spotlight-title {
            font-size: clamp(1.55rem, 2.8vw, 2.35rem); font-weight: 900; color: #fff;
            line-height: 1.25; letter-spacing: -0.03em; margin-bottom: 0.65rem;
        }
        .spotlight-sub { font-size: 1rem; font-weight: 700; color: var(--mod-secondary); margin-bottom: 1.25rem; }
        .spotlight-body {
            font-size: clamp(1.05rem, 1.55vw, 1.24rem); color: #E2E8F0; line-height: 1.78;
            font-weight: 500; margin-bottom: 1.4rem;
        }
        .spotlight-list { list-style: none; display: flex; flex-direction: column; gap: 0.85rem; margin-bottom: 1.4rem; }
        .spotlight-list li {
            font-size: 1.05rem; color: #F1F5F9; line-height: 1.65; padding: 0.85rem 1.1rem 0.85rem 2.3rem;
            border-radius: 14px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
            position: relative;
        }
        .spotlight-list li::before { content: '→'; position: absolute; left: 0.95rem; color: var(--mod-accent); font-weight: 900; }

        /* Spotlight Bottom Sequential Chain Switcher */
        .spotlight-chain-bar {
            margin-top: 1.5rem; padding-top: 1.2rem; border-top: 1px solid rgba(255,255,255,0.1);
            display: flex; align-items: center; justify-content: space-between; gap: 0.8rem; flex-wrap: wrap;
        }
        .chain-pills { display: flex; flex-wrap: wrap; gap: 6px; }
        .chain-pill {
            border: 1px solid var(--border-glass); background: rgba(255,255,255,0.05); color: var(--text-sub);
            font-family: inherit; font-size: 0.78rem; font-weight: 700; padding: 6px 12px; border-radius: 999px;
            cursor: pointer; transition: all 0.2s; max-width: 185px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .chain-pill:hover { border-color: var(--mod-accent); color: #fff; }
        .chain-pill.active { background: var(--mod-accent); color: #030712; border-color: var(--mod-accent); font-weight: 800; }
        .chain-nav-btns { display: flex; gap: 8px; }

        /* Layout Grids & Components */
        .hero-wrap { text-align: center; max-width: 980px; margin: 0 auto; }
        .hero-sub { font-size: clamp(1.05rem, 1.6vw, 1.32rem); color: var(--text-sub); line-height: 1.65; margin-bottom: 2rem; font-weight: 500; }
        .hero-meta-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
        .hero-chip { padding: 9px 16px; border-radius: 12px; background: rgba(255,255,255,0.05); border: 1px solid var(--border-glass); font-size: 0.86rem; color: var(--text-sub); font-weight: 600; }

        .editorial-grid { display: grid; grid-template-columns: 0.85fr 1.35fr; gap: 2rem; align-items: center; }
        .editorial-big {
            font-family: 'JetBrains Mono', monospace; font-size: clamp(2.8rem, 5.6vw, 5rem); font-weight: 900;
            letter-spacing: -0.04em; line-height: 1; padding: 2.4rem 1.6rem; border-radius: 24px; text-align: center;
            background: linear-gradient(145deg, rgba(255,255,255,0.06), rgba(255,255,255,0.01));
            border: 1px solid var(--border-glass); color: var(--mod-accent);
            text-shadow: 0 0 40px color-mix(in srgb, var(--mod-accent) 40%, transparent);
        }
        .point-stack { display: flex; flex-direction: column; gap: 0.9rem; }
        .point-row {
            display: flex; gap: 1rem; align-items: center; padding: 1.1rem 1.3rem; border-radius: 16px;
            background: rgba(15,23,42,0.68); border: 1px solid var(--border-glass);
        }
        .point-icon { width: 42px; height: 42px; border-radius: 12px; background: color-mix(in srgb, var(--mod-accent) 18%, transparent); color: var(--mod-accent); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 1.05rem; }
        .point-row h4 { font-size: 1.04rem; font-weight: 800; color: #fff; margin-bottom: 2px; }
        .point-row p { font-size: 0.89rem; color: var(--text-sub); line-height: 1.5; }

        .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.3rem; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.15rem; }
        .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.05rem; }
        .grid-5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.9rem; }

        .vs-box { padding: 1.7rem; border-radius: 20px; border: 1px solid var(--border-glass); }
        .vs-left { background: rgba(148, 163, 184, 0.06); }
        .vs-right { background: linear-gradient(145deg, color-mix(in srgb, var(--mod-accent) 15%, transparent), rgba(15,23,42,0.75)); border-color: color-mix(in srgb, var(--mod-accent) 45%, transparent); }
        .vs-box h3 { font-size: 1.2rem; font-weight: 800; margin-bottom: 1rem; display: flex; align-items: center; gap: 8px; }
        .vs-list { list-style: none; display: flex; flex-direction: column; gap: 0.72rem; }
        .vs-list li { font-size: 0.94rem; color: var(--text-sub); line-height: 1.5; padding-left: 1.35rem; position: relative; }
        .vs-list li::before { content: '→'; position: absolute; left: 0; color: var(--mod-accent); font-weight: 900; }

        .quote-box {
            padding: clamp(1.8rem, 3.2vw, 2.8rem); border-radius: 24px;
            background: linear-gradient(145deg, rgba(255,255,255,0.06), rgba(15,23,42,0.75));
            border: 1px solid color-mix(in srgb, var(--mod-accent) 38%, transparent);
        }
        .quote-kr { font-size: clamp(1.25rem, 2.2vw, 1.78rem); font-weight: 800; line-height: 1.55; color: #fff; margin-bottom: 1rem; }
        .quote-en { font-size: 0.92rem; color: var(--text-muted); font-style: italic; line-height: 1.55; margin-bottom: 1.25rem; }

        .pillar-desc { font-size: 0.87rem; color: var(--text-sub); line-height: 1.55; }
        .footer-strip {
            margin-top: 1.15rem; padding: 0.85rem 1.25rem; border-radius: 12px;
            background: color-mix(in srgb, var(--mod-accent) 13%, transparent);
            border: 1px solid color-mix(in srgb, var(--mod-accent) 36%, transparent);
            font-size: 0.92rem; font-weight: 700; color: #fff; text-align: center;
        }

        .kpi-card { text-align: center; padding: 2.4rem 1.8rem; }
        .kpi-number { font-family: 'JetBrains Mono', monospace; font-size: clamp(3.8rem, 7.2vw, 6rem); font-weight: 900; line-height: 1; margin-bottom: 0.8rem; }
        .kpi-label { font-size: 1.18rem; font-weight: 800; color: #fff; margin-bottom: 0.5rem; }

        // ========== FLIP CENTER-STAGE SPOTLIGHT ENGINE (v2.0) ==========
        window.openSpotlight = function(itemIdx, sourceEl) {
            if (!currentFocusItems[itemIdx]) return;
            const firstRect = sourceEl ? sourceEl.getBoundingClientRect() : null;
            activeFocusIdx = itemIdx;
            const item = currentFocusItems[itemIdx];
            const overlay = document.getElementById('spotlightOverlay');
            const stage = document.getElementById('spotlightStage');

            stage.innerHTML = `
                <button class="spotlight-close" onclick="closeSpotlight()" title="닫기 (ESC)"><i class="fa-solid fa-xmark"></i></button>
                <div class="spotlight-kicker">${item.kicker || `DETAIL ${String(itemIdx+1).padStart(2,'0')} / ${String(currentFocusItems.length).padStart(2,'0')}`}</div>
                <h2 class="spotlight-title">${item.title}</h2>
                ${item.sub ? `<div class="spotlight-sub">${item.sub}</div>` : ''}
                ${item.body ? `<div class="spotlight-body">${item.body}</div>` : ''}
                ${item.list ? `<ul class="spotlight-list">${item.list.map(li => `<li>${li}</li>`).join('')}</ul>` : ''}
                ${item.tags ? `<div class="tag-row">${item.tags.map(t => `<span class="mini-tag">${t}</span>`).join('')}</div>` : ''}
                <div class="spotlight-chain-bar">
                    <div class="chain-pills">
                        ${currentFocusItems.map((fi, i) => `
                            <button class="chain-pill ${i===itemIdx?'active':''}" onclick="switchSpotlight(${i})">
                                ${String(i+1).padStart(2,'0')}. ${fi.shortLabel || fi.title.replace(/<[^>]+>/g,'').slice(0,18)}
                            </button>
                        `).join('')}
                    </div>
                    <div class="chain-nav-btns">
                        <button class="nav-btn" onclick="stepSpotlight(-1)" ${itemIdx===0?'disabled':''}><i class="fa-solid fa-chevron-left"></i> 이전 카드</button>
                        <button class="nav-btn" style="background:var(--mod-accent); color:#030712; border-color:var(--mod-accent);" onclick="stepSpotlight(1)">
                            ${itemIdx === currentFocusItems.length - 1 ? '다음 슬라이드 <i class="fa-solid fa-forward"></i>' : '다음 카드 <i class="fa-solid fa-chevron-right"></i>'}
                        </button>
                    </div>
                </div>
            `;

            document.body.classList.add('spotlight-open');
            overlay.classList.add('open');

            // True FLIP Animation (First -> Last -> Invert -> Play)
            stage.style.transition = 'none';
            if (firstRect) {
                const lastRect = stage.getBoundingClientRect();
                const dx = (firstRect.left + firstRect.width / 2) - (lastRect.left + lastRect.width / 2);
                const dy = (firstRect.top + firstRect.height / 2) - (lastRect.top + lastRect.height / 2);
                const sx = Math.max(0.28, firstRect.width / lastRect.width);
                const sy = Math.max(0.28, firstRect.height / lastRect.height);
                stage.style.transform = `translate3d(${dx}px, ${dy}px, 0) scale(${sx}, ${sy})`;
                stage.style.opacity = '0.25';
            } else {
                stage.style.transform = 'scale(0.88) translateY(24px)';
                stage.style.opacity = '0';
            }
            void stage.offsetWidth;
            stage.style.transition = 'transform 0.62s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.45s ease';
            stage.style.transform = 'translate3d(0, 0, 0) scale(1)';
            stage.style.opacity = '1';
        };

            stage.style.transition = 'transform 0.22s ease, opacity 0.18s ease';

            stage.style.opacity = '0';
            setTimeout(() => openSpotlight(nextIdx, null), 170);

        window.stepSpotlight = function(delta) {
            const target = activeFocusIdx + delta;
            if (target >= 0 && target < currentFocusItems.length) {

                closeSpotlight();

                        scales: {
                            x: { max: 100, grid: { color: 'rgba(255,255,255,0.08)' }, ticks: { color: '#CBD5E1', callback: v => v+'%' } },
                            y: { grid: { display: false }, ticks: { color: '#F8FAFC', font: { weight: '700' } } }
                        }
                    }
                });
            }
        }

        function renderSlide(idx, dir = 1) {
            closeSpotlight();
            currentIdx = Math.max(0, Math.min(SLIDES.length - 1, idx));
            const s = SLIDES[currentIdx];
            const mod = MODULES.find(m => m.id === s.mod);

            document.documentElement.style.setProperty('--mod-accent', mod.accent);
            document.documentElement.style.setProperty('--mod-secondary', mod.secondary);
            document.getElementById('orb1').style.background = `radial-gradient(circle, ${mod.orb1} 0%, transparent 70%)`;
            document.getElementById('orb2').style.background = `radial-gradient(circle, ${mod.orb2} 0%, transparent 70%)`;

            document.querySelectorAll('.mod-tab').forEach(btn => btn.classList.toggle('active', btn.dataset.mod === s.mod));
            document.querySelectorAll('.thumb-card').forEach(c => c.classList.toggle('current', Number(c.dataset.idx) === currentIdx));
            document.getElementById('curNum').textContent = String(s.num).padStart(2, '0');
            document.getElementById('modIndicator').textContent = s.mod;
            document.getElementById('progressLine').style.width = `${((currentIdx + 1) / SLIDES.length) * 100}%`;
            document.getElementById('prevBtn').disabled = currentIdx === 0;
            document.getElementById('nextBtn').disabled = currentIdx === SLIDES.length - 1;

            document.getElementById('notesBody').textContent = s.notes || '';
            document.getElementById('notesTime').textContent = `권장 발화: 약 ${s.sec}초 · 전환: ${s.trans.toUpperCase()}`;

            const frame = document.getElementById('slideFrame');
            frame.className = 'slide-frame';
            void frame.offsetWidth;
            let animClass = 'anim-morph';
            if (s.trans === 'zoom') animClass = 'anim-zoom';
            else if (s.trans === 'push-h') animClass = dir >= 0 ? 'anim-push-next' : 'anim-push-prev';
            else if (s.trans === 'split') animClass = 'anim-split';

            frame.innerHTML = buildSlideBody(s);
            frame.classList.add(animClass);

            animateCounters();
            mountCharts(s);
            if (s.layout === 'mask5-simulator') renderMaskSimulator();
            if (s.layout === 'traffic-light') renderTrafficLight();
            if (s.layout === 'checklist-15') renderChecklist();
        }

        window.jumpToSlide = function(idx) { renderSlide(idx, idx >= currentIdx ? 1 : -1); };

        function toggleMinimalMode() {
            minimalMode = !minimalMode;
            document.body.classList.toggle('minimal-mode', minimalMode);
            document.getElementById('modeToggleText').textContent = minimalMode ? '미니멀 클로즈업 ON' : '전체 텍스트 펼침';
            showToast(minimalMode ? '시네마틱 미니멀 모드 (카드 클릭 시 중앙 클로즈업)' : '전체 텍스트 펼치기 모드');
        }

        function toggleGrid(force) {
            const m = document.getElementById('gridModal');
            const next = typeof force === 'boolean' ? force : !m.classList.contains('open');
            m.classList.toggle('open', next);
            document.getElementById('gridBtn').classList.toggle('active', next);
        }

        function toggleNotes() {
            const d = document.getElementById('notesDrawer');
            const next = !d.classList.contains('open');
            d.classList.toggle('open', next);
            document.getElementById('notesBtn').classList.toggle('active', next);
        }

        // 60-Minute Timer
        let remainSec = 3600, timerId = null;
        function updateTimerUI() {
            const m = Math.floor(remainSec / 60), sc = remainSec % 60;
            document.getElementById('timerText').textContent = `${String(m).padStart(2,'0')}:${String(sc).padStart(2,'0')}`;
        }
        document.getElementById('timerBtn').addEventListener('click', () => {
            if (timerId) { clearInterval(timerId); timerId = null; document.getElementById('timerBtn').classList.remove('running'); }
            else {
                document.getElementById('timerBtn').classList.add('running');
                timerId = setInterval(() => { if (remainSec > 0) { remainSec--; updateTimerUI(); } }, 1000);
            }
        });
        document.getElementById('timerBtn').addEventListener('dblclick', () => {
            if (timerId) { clearInterval(timerId); timerId = null; }
            remainSec = 3600; updateTimerUI(); document.getElementById('timerBtn').classList.remove('running');
        });

        document.getElementById('modeToggleBtn').addEventListener('click', toggleMinimalMode);
        document.getElementById('prevBtn').addEventListener('click', () => renderSlide(currentIdx - 1, -1));
        document.getElementById('nextBtn').addEventListener('click', () => renderSlide(currentIdx + 1, 1));
        document.getElementById('notesBtn').addEventListener('click', toggleNotes);
        document.getElementById('gridBtn').addEventListener('click', () => toggleGrid());
        document.getElementById('closeGridBtn').addEventListener('click', () => toggleGrid(false));
        document.getElementById('fsBtn').addEventListener('click', () => {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
            else document.exitFullscreen?.();
        });

        window.addEventListener('keydown', e => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            const spotOpen = document.getElementById('spotlightOverlay').classList.contains('open');
            if (e.key === 'Escape') {
                if (spotOpen) closeSpotlight();
                else toggleGrid(false);
                return;
            }
            if (e.key === 'ArrowDown') {
                e.preventDefault();
                if (!spotOpen && currentFocusItems.length > 0) {
                    const firstEl = document.querySelector('.focusable-card');
                    openSpotlight(0, firstEl);
                } else if (spotOpen) {
                    stepSpotlight(1);
                }
                return;
            }
            if (e.key === 'ArrowUp') {
                e.preventDefault();
                if (spotOpen) {
                    if (activeFocusIdx > 0) stepSpotlight(-1);
                    else closeSpotlight();
                }
                return;
            }
            if (e.key === 'ArrowRight' || e.key === ' ') {
                e.preventDefault();
                if (spotOpen) stepSpotlight(1);
                else renderSlide(currentIdx + 1, 1);
            } else if (e.key === 'ArrowLeft') {
                if (spotOpen) stepSpotlight(-1);
                else renderSlide(currentIdx - 1, -1);
            } else if (e.key.toLowerCase() === 'm') toggleMinimalMode();
            else if (e.key.toLowerCase() === 'n') toggleNotes();
            else if (e.key.toLowerCase() === 'g') toggleGrid();
            else if (e.key.toLowerCase() === 'f') document.getElementById('fsBtn').click();
        });

        let touchX = 0;
        document.getElementById('stageViewport').addEventListener('touchstart', e => { touchX = e.changedTouches[0].screenX; }, { passive: true });
        document.getElementById('stageViewport').addEventListener('touchend', e => {
            const dx = e.changedTouches[0].screenX - touchX;
            if (Math.abs(dx) > 55) renderSlide(currentIdx + (dx < 0 ? 1 : -1), dx < 0 ? 1 : -1);
        }, { passive: true });

        window.addEventListener('mousemove', e => {
            const rx = (e.clientX / window.innerWidth - 0.5) * 28;
            const ry = (e.clientY / window.innerHeight - 0.5) * 28;
            document.getElementById('orb1').style.transform = `translate3d(${rx}px, ${ry}px, 0)`;
            document.getElementById('orb2').style.transform = `translate3d(${-rx}px, ${-ry}px, 0)`;
        });

        initChrome();
        renderSlide(0, 1);
    </script>
</body>
</html>
