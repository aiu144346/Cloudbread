    <meta name="description" content="Luis Urrutia 시네마틱 Morph & Push 모션그래픽 엔진 기반 4모듈 58슬라이드 웹 프레젠테이션. 2026 AI 기본법·MASK-5 비식별화 시뮬레이터·소크라테스 프롬프트 5종·울산 1+5+N 협력 거버넌스.">
    <link rel="canonical" href="https://www.cloudbread.me/lecture-ulsan-career.html">

    <!-- Fonts & Icons -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --bg-void: #050811;
            --bg-surface: rgba(15, 23, 42, 0.72);
            --bg-glass: rgba(15, 23, 42, 0.58);
            --border-glass: rgba(255, 255, 255, 0.11);
            --text-main: #F8FAFC;
            --text-sub: #CBD5E1;
            --text-muted: #94A3B8;
            --mod-accent: #10B981;
            --mod-secondary: #38BDF8;
            --ease-cinematic: cubic-bezier(0.16, 1, 0.3, 1);
            --ease-morph: cubic-bezier(0.22, 1, 0.36, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
        html, body {
            width: 100%; height: 100%; overflow: hidden;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-void); color: var(--text-main);
        }

        /* Cinematic Dark Ambient Stage (Luis Urrutia Soft-Edge Atmosphere) */
        .cinematic-stage-bg {
            position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden;
            background: radial-gradient(circle at 50% 45%, #0B1325 0%, #050811 72%, #020409 100%);
        }
        .ambient-orb {
            position: absolute; border-radius: 50%; filter: blur(130px); opacity: 0.42;
            transition: background 1.2s var(--ease-cinematic), transform 1.4s var(--ease-cinematic);
            will-change: transform, background;
        }
        .orb-1 { width: 680px; height: 680px; top: -220px; left: -160px; background: radial-gradient(circle, #065F46 0%, transparent 70%); }
        .orb-2 { width: 640px; height: 640px; bottom: -220px; right: -160px; background: radial-gradient(circle, #1E3A8A 0%, transparent 70%); }
        .soft-vignette {
            position: fixed; inset: 0; pointer-events: none; z-index: 1;
            background: radial-gradient(ellipse at center, transparent 52%, rgba(2, 4, 9, 0.78) 100%);
        }
        .grid-overlay {
            position: fixed; inset: 0; pointer-events: none; z-index: 1; opacity: 0.04;
            background-image: linear-gradient(rgba(255,255,255,0.4) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.4) 1px, transparent 1px);
            background-size: 64px 64px;
            mask-image: radial-gradient(circle at center, black 35%, transparent 85%);
        }

        /* Top Glass Navbar */
        .top-bar {
            position: fixed; top: 0; left: 0; right: 0; height: 62px; z-index: 100;
            background: rgba(5, 8, 17, 0.78); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
            border-bottom: 1px solid var(--border-glass);
            display: flex; align-items: center; justify-content: space-between; padding: 0 1.4rem; gap: 1rem;
        }
        .brand-left { display: flex; align-items: center; gap: 0.75rem; min-width: 0; }
        .back-pill {
            color: var(--text-sub); text-decoration: none; font-size: 0.8rem; font-weight: 700;
            padding: 6px 12px; border-radius: 999px; border: 1px solid var(--border-glass);
            background: rgba(255,255,255,0.04); display: inline-flex; align-items: center; gap: 6px;
            transition: all 0.2s ease; white-space: nowrap;
        }
        .back-pill:hover { background: rgba(255,255,255,0.12); color: #fff; }
        .deck-label { font-size: 0.84rem; font-weight: 800; letter-spacing: -0.02em; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .deck-label span { color: var(--mod-accent); }

        .module-tabs { display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.04); padding: 4px; border-radius: 999px; border: 1px solid var(--border-glass); }
        .mod-tab {
            border: none; background: transparent; color: var(--text-muted); font-family: inherit;
            font-size: 0.78rem; font-weight: 700; padding: 6px 13px; border-radius: 999px; cursor: pointer;
            transition: all 0.25s var(--ease-cinematic); white-space: nowrap;
        }
        .mod-tab:hover { color: #fff; }
        .mod-tab.active { background: var(--mod-accent); color: #030712; box-shadow: 0 0 18px color-mix(in srgb, var(--mod-accent) 45%, transparent); }

        .top-controls { display: flex; align-items: center; gap: 8px; }
        .timer-chip {
            font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; font-weight: 700;
            padding: 5px 11px; border-radius: 8px; border: 1px solid var(--border-glass);
            background: rgba(255,255,255,0.04); color: var(--text-sub); cursor: pointer;
            display: inline-flex; align-items: center; gap: 6px;
        }
        .timer-chip.running { border-color: var(--mod-accent); color: var(--mod-accent); }
        .icon-btn {
            width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--border-glass);
            background: rgba(255,255,255,0.04); color: var(--text-sub); cursor: pointer;
            display: inline-flex; align-items: center; justify-content: center; transition: all 0.2s;
        }
        .icon-btn:hover, .icon-btn.active { background: rgba(255,255,255,0.14); color: #fff; border-color: var(--mod-accent); }

        /* Main Slide Viewport */
        .stage-viewport {
            position: fixed; top: 62px; bottom: 56px; left: 0; right: 0; z-index: 10;
            display: flex; align-items: center; justify-content: center;
            padding: clamp(1rem, 2.5vw, 2.2rem) clamp(1.2rem, 4vw, 4rem);
            perspective: 1400px; overflow: hidden;
        }
        .slide-frame {
            width: 100%; max-width: 1240px; height: 100%; max-height: 760px;
            display: flex; flex-direction: column; justify-content: center; position: relative;
            will-change: transform, opacity, filter;
        }

        /* Cinematic Transition Animations (Luis Urrutia Morph / Push-H / Zoom / Split) */
        @keyframes enterZoom {
            from { opacity: 0; transform: scale(1.07) translateY(14px); filter: blur(8px); }
            to { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
        }
        @keyframes enterMorph {
            from { opacity: 0; transform: scale(0.96) translateY(18px); filter: blur(4px); }
            to { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
        }
        @keyframes enterPushRight {
            from { opacity: 0; transform: translate3d(110px, 0, 0) scale(0.98); }
            to { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
        }
        @keyframes enterPushLeft {
            from { opacity: 0; transform: translate3d(-110px, 0, 0) scale(0.98); }
            to { opacity: 1; transform: translate3d(0, 0, 0) scale(1); }
        }
        @keyframes enterSplit {
            from { opacity: 0; clip-path: inset(0 48% 0 48%); }
            to { opacity: 1; clip-path: inset(0 0 0 0); }
        }
        .anim-zoom { animation: enterZoom 0.78s var(--ease-cinematic) both; }
        .anim-morph { animation: enterMorph 0.72s var(--ease-morph) both; }
        .anim-push-next { animation: enterPushRight 0.72s var(--ease-cinematic) both; }
        .anim-push-prev { animation: enterPushLeft 0.72s var(--ease-cinematic) both; }
        .anim-split { animation: enterSplit 0.78s var(--ease-cinematic) both; }

        .stagger-item { opacity: 0; transform: translateY(16px); animation: staggerUp 0.6s var(--ease-cinematic) forwards; }
        @keyframes staggerUp { to { opacity: 1; transform: translateY(0); } }

        /* Typography & Gradients */
        .slide-top-meta { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 0.9rem; flex-wrap: wrap; }
        .slide-badge {
            display: inline-flex; align-items: center; gap: 8px; padding: 5px 14px; border-radius: 999px;
            font-size: 0.78rem; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase;
            background: color-mix(in srgb, var(--mod-accent) 16%, transparent);
            color: var(--mod-accent); border: 1px solid color-mix(in srgb, var(--mod-accent) 42%, transparent);
        }
        .timeline-pill {
            font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; font-weight: 700;
            color: #94A3B8; background: rgba(255,255,255,0.05); border: 1px solid var(--border-glass);
            padding: 4px 12px; border-radius: 999px; display: inline-flex; align-items: center; gap: 6px;
        }
        .slide-title {
            font-size: clamp(1.75rem, 3.4vw, 2.85rem); font-weight: 900; line-height: 1.22;
            letter-spacing: -0.03em; color: #FFFFFF; margin-bottom: 1.35rem;
        }
        .hero-title { font-size: clamp(2.3rem, 4.8vw, 4.1rem); line-height: 1.15; margin-bottom: 1.2rem; }
        .grad-emerald { background: linear-gradient(120deg, #34D399, #38BDF8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .grad-cyan { background: linear-gradient(120deg, #38BDF8, #818CF8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .grad-gold { background: linear-gradient(120deg, #FBBF24, #F97316); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .grad-rose { background: linear-gradient(120deg, #FB7185, #F43F5E); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* Reusable Glass Cards */
        .glass-card {
            background: var(--bg-surface); border: 1px solid var(--border-glass); border-radius: 18px;
            padding: 1.4rem 1.55rem; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.35); transition: transform 0.25s var(--ease-cinematic), border-color 0.25s;
        }
        .glass-card:hover { border-color: rgba(255,255,255,0.24); transform: translateY(-2px); }

        /* Layout: Hero & Opener */
        .hero-wrap { text-align: center; max-width: 980px; margin: 0 auto; }
        .hero-sub { font-size: clamp(1.05rem, 1.6vw, 1.32rem); color: var(--text-sub); line-height: 1.65; margin-bottom: 2rem; font-weight: 500; }
        .hero-meta-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
        .hero-chip {
            padding: 9px 16px; border-radius: 12px; background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-glass); font-size: 0.86rem; color: var(--text-sub); font-weight: 600;
        }

        /* Layout: Editorial Focus */
        .editorial-grid { display: grid; grid-template-columns: 0.85fr 1.35fr; gap: 2rem; align-items: center; }
        .editorial-big {
            font-family: 'JetBrains Mono', monospace; font-size: clamp(2.8rem, 5.6vw, 5rem); font-weight: 900;
            letter-spacing: -0.04em; line-height: 1; padding: 2.2rem 1.6rem; border-radius: 22px; text-align: center;
            background: linear-gradient(145deg, rgba(255,255,255,0.06), rgba(255,255,255,0.01));
            border: 1px solid var(--border-glass); color: var(--mod-accent);
            text-shadow: 0 0 40px color-mix(in srgb, var(--mod-accent) 40%, transparent);
        }
        .point-stack { display: flex; flex-direction: column; gap: 0.9rem; }
        .point-row { display: flex; gap: 1rem; align-items: flex-start; padding: 1.05rem 1.25rem; border-radius: 14px; background: rgba(255,255,255,0.04); border: 1px solid var(--border-glass); }
        .point-icon { width: 38px; height: 38px; border-radius: 10px; background: color-mix(in srgb, var(--mod-accent) 18%, transparent); color: var(--mod-accent); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 1rem; }
        .point-row h4 { font-size: 1.02rem; font-weight: 800; color: #fff; margin-bottom: 3px; }
        .point-row p { font-size: 0.9rem; color: var(--text-sub); line-height: 1.5; }

        /* Layout: Grids */
        .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.25rem; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.1rem; }
        .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; }
        .grid-5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.85rem; }

        .vs-box { padding: 1.6rem; border-radius: 18px; border: 1px solid var(--border-glass); }
        .vs-left { background: rgba(148, 163, 184, 0.06); }
        .vs-right { background: linear-gradient(145deg, color-mix(in srgb, var(--mod-accent) 15%, transparent), rgba(15,23,42,0.75)); border-color: color-mix(in srgb, var(--mod-accent) 45%, transparent); }
        .vs-box h3 { font-size: 1.12rem; font-weight: 800; margin-bottom: 1rem; display: flex; align-items: center; gap: 8px; }
        .vs-list { list-style: none; display: flex; flex-direction: column; gap: 0.72rem; }
        .vs-list li { font-size: 0.94rem; color: var(--text-sub); line-height: 1.5; padding-left: 1.35rem; position: relative; }
        .vs-list li::before { content: '→'; position: absolute; left: 0; color: var(--mod-accent); font-weight: 900; }

        /* Quote Hero */
        .quote-box {
            padding: clamp(1.8rem, 3.2vw, 2.8rem); border-radius: 24px;
            background: linear-gradient(145deg, rgba(255,255,255,0.06), rgba(15,23,42,0.75));
            border: 1px solid color-mix(in srgb, var(--mod-accent) 38%, transparent);
            position: relative; overflow: hidden;
        }
        .quote-kr { font-size: clamp(1.25rem, 2.15vw, 1.72rem); font-weight: 800; line-height: 1.55; color: #fff; margin-bottom: 1rem; }
        .quote-en { font-size: 0.92rem; color: var(--text-muted); font-style: italic; line-height: 1.55; margin-bottom: 1.25rem; }
        .quote-author { font-size: 0.96rem; font-weight: 800; color: var(--mod-accent); }
        .tag-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 1.1rem; }
        .mini-tag { font-size: 0.78rem; font-weight: 700; padding: 4px 11px; border-radius: 999px; background: rgba(255,255,255,0.07); color: var(--text-sub); }

        /* Pillars & Bento */
        .pillar-num { font-family: 'JetBrains Mono', monospace; font-size: 1.8rem; font-weight: 900; color: var(--mod-accent); margin-bottom: 0.5rem; }
        .pillar-title { font-size: 1.04rem; font-weight: 800; color: #fff; margin-bottom: 0.45rem; }
        .pillar-desc { font-size: 0.87rem; color: var(--text-sub); line-height: 1.55; }
        .footer-strip {
            margin-top: 1.15rem; padding: 0.85rem 1.25rem; border-radius: 12px;
            background: color-mix(in srgb, var(--mod-accent) 13%, transparent);
            border: 1px solid color-mix(in srgb, var(--mod-accent) 36%, transparent);
            font-size: 0.92rem; font-weight: 700; color: #fff; text-align: center;
        }

        /* Dual KPI */
        .kpi-card { text-align: center; padding: 2.2rem 1.8rem; }
        .kpi-number { font-family: 'JetBrains Mono', monospace; font-size: clamp(3.6rem, 7vw, 5.8rem); font-weight: 900; line-height: 1; margin-bottom: 0.7rem; }
        .kpi-label { font-size: 1.14rem; font-weight: 800; color: #fff; margin-bottom: 0.5rem; }
        .kpi-sub { font-size: 0.9rem; color: var(--text-sub); line-height: 1.55; }

        /* Tables */
        .cinematic-table { width: 100%; border-collapse: collapse; overflow: hidden; border-radius: 16px; border: 1px solid var(--border-glass); background: rgba(15,23,42,0.72); }
        .cinematic-table th { text-align: left; padding: 0.95rem 1.15rem; font-size: 0.86rem; font-weight: 800; background: rgba(255,255,255,0.06); color: var(--mod-accent); border-bottom: 1px solid var(--border-glass); }
        .cinematic-table td { padding: 0.9rem 1.15rem; font-size: 0.88rem; color: var(--text-sub); line-height: 1.5; border-bottom: 1px solid rgba(255,255,255,0.06); }
        .cinematic-table tr:last-child td { border-bottom: none; }
        .cinematic-table td:first-child { font-weight: 800; color: #fff; white-space: nowrap; }

        /* Prompt Copy Card */
        .prompt-box {
            background: #090F1E; border: 1px solid color-mix(in srgb, var(--mod-accent) 45%, transparent);
            border-radius: 16px; padding: 1.25rem 1.4rem; position: relative; max-height: 370px; overflow-y: auto;
        }
        .prompt-pre {
            font-family: 'JetBrains Mono', 'Pretendard', monospace; font-size: 0.84rem; line-height: 1.65;
            color: #E2E8F0; white-space: pre-wrap; word-break: keep-all;
        }
        .copy-btn {
            position: sticky; top: 0; float: right; z-index: 5;
            background: var(--mod-accent); color: #030712; border: none; border-radius: 10px;
            padding: 8px 16px; font-family: inherit; font-size: 0.82rem; font-weight: 800; cursor: pointer;
            display: inline-flex; align-items: center; gap: 6px; box-shadow: 0 6px 20px rgba(16,185,129,0.35);
        }
        .copy-btn:hover { filter: brightness(1.1); }

        /* Interactive MASK-5 Simulator */
        .sim-wrap { display: flex; flex-direction: column; gap: 1rem; }
        .sim-toggle-bar { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
        .sim-btn {
            padding: 10px 22px; border-radius: 12px; border: none; font-family: inherit; font-weight: 800; font-size: 0.92rem;
            cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: all 0.25s;
        }
        .sim-btn.red { background: #F43F5E; color: #fff; box-shadow: 0 6px 22px rgba(244,63,94,0.35); }
        .sim-btn.green { background: #10B981; color: #030712; box-shadow: 0 6px 22px rgba(16,185,129,0.35); }
        .sim-stage {
            padding: 1.8rem 2rem; border-radius: 20px; font-size: 1.1rem; line-height: 1.85;
            transition: all 0.55s var(--ease-cinematic); border: 2px solid;
        }
        .sim-stage.danger { background: rgba(244,63,94,0.09); border-color: rgba(244,63,94,0.55); }
        .sim-stage.safe { background: rgba(16,185,129,0.09); border-color: rgba(16,185,129,0.55); }
        .pii-bad { background: rgba(244,63,94,0.28); color: #FDA4AF; padding: 2px 7px; border-radius: 6px; font-weight: 800; text-decoration: line-through rgba(244,63,94,0.8); }
        .pii-safe { background: rgba(16,185,129,0.24); color: #6EE7B7; padding: 2px 8px; border-radius: 6px; font-weight: 800; }

        /* Interactive Traffic Light */
        .tl-grid { display: grid; grid-template-columns: 110px 1fr; gap: 1.5rem; align-items: center; }
        .tl-housing {
            background: #0A1020; border: 1px solid var(--border-glass); border-radius: 28px;
            padding: 1rem 0.7rem; display: flex; flex-direction: column; align-items: center; gap: 1rem;
        }
        .tl-lamp {
            width: 64px; height: 64px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.18);
            cursor: pointer; opacity: 0.35; transition: all 0.3s;
        }
        .tl-lamp.active { opacity: 1; transform: scale(1.1); }
        .tl-lamp.r { background: #F43F5E; box-shadow: 0 0 28px rgba(244,63,94,0.65); }
        .tl-lamp.y { background: #F59E0B; box-shadow: 0 0 28px rgba(245,158,11,0.65); }
        .tl-lamp.g { background: #10B981; box-shadow: 0 0 28px rgba(16,185,129,0.65); }

        /* Governance 1+5+N Diagram */
        .gov-stack { display: flex; flex-direction: column; gap: 0.9rem; }
        .gov-tier { padding: 1.05rem 1.3rem; border-radius: 16px; border: 1px solid var(--border-glass); background: rgba(15,23,42,0.75); }
        .gov-tier h4 { font-size: 0.95rem; font-weight: 800; margin-bottom: 0.45rem; display: flex; align-items: center; gap: 8px; }
        .gov-chips { display: flex; flex-wrap: wrap; gap: 8px; }
        .gov-chip { padding: 6px 12px; border-radius: 10px; font-size: 0.82rem; font-weight: 700; background: rgba(255,255,255,0.06); color: var(--text-sub); border: 1px solid rgba(255,255,255,0.09); }

        /* Ladder 4 */
        .ladder-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.9rem; align-items: end; }
        .ladder-col { padding: 1.2rem; border-radius: 16px; border: 1px solid var(--border-glass); background: rgba(15,23,42,0.78); display: flex; flex-direction: column; gap: 0.5rem; }
        .ladder-hrs { font-family: 'JetBrains Mono', monospace; font-size: 1.55rem; font-weight: 900; color: #FBBF24; }

        /* Checklist 15 Interactive */
        .check-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; max-height: 410px; overflow-y: auto; padding-right: 4px; }
        .check-item {
            display: flex; align-items: flex-start; gap: 10px; padding: 0.62rem 0.85rem; border-radius: 10px;
            background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); cursor: pointer;
            font-size: 0.82rem; color: var(--text-sub); line-height: 1.45; transition: all 0.2s;
        }
        .check-item.checked { background: rgba(16,185,129,0.14); border-color: rgba(16,185,129,0.5); color: #fff; }
        .check-item input { margin-top: 3px; accent-color: #10B981; cursor: pointer; }
        .score-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.85rem; padding: 0.7rem 1.1rem; border-radius: 12px; background: rgba(16,185,129,0.12); border: 1px solid rgba(16,185,129,0.35); }

        /* QA Flip Cards */
        .qa-stack { display: flex; flex-direction: column; gap: 0.65rem; max-height: 440px; overflow-y: auto; }
        .qa-card {
            border-radius: 13px; border: 1px solid var(--border-glass); background: rgba(15,23,42,0.76);
            padding: 0.88rem 1.15rem; cursor: pointer; transition: all 0.25s;
        }
        .qa-card:hover { border-color: var(--mod-accent); }
        .qa-q { font-size: 0.93rem; font-weight: 800; color: #fff; display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
        .qa-a { font-size: 0.87rem; color: #A7F3D0; line-height: 1.55; margin-top: 0.55rem; padding-top: 0.55rem; border-top: 1px solid rgba(255,255,255,0.08); display: none; }
        .qa-card.open .qa-a { display: block; }
        .qa-card.open { border-color: var(--mod-accent); background: rgba(16,185,129,0.08); }

        /* Chart Container */
        .chart-layout { display: grid; grid-template-columns: 1.3fr 0.9fr; gap: 1.4rem; align-items: center; }
        .chart-card { height: 350px; padding: 1.2rem; }

        /* Bottom Control Dock */
        .bottom-dock {
            position: fixed; bottom: 0; left: 0; right: 0; height: 56px; z-index: 100;
            background: rgba(5, 8, 17, 0.82); backdrop-filter: blur(18px);
            border-top: 1px solid var(--border-glass);
            display: flex; align-items: center; justify-content: space-between; padding: 0 1.4rem; gap: 1rem;
        }
        .progress-line { position: absolute; top: 0; left: 0; height: 3px; background: linear-gradient(90deg, var(--mod-accent), var(--mod-secondary)); transition: width 0.45s var(--ease-cinematic); }
        .slide-counter { font-family: 'JetBrains Mono', monospace; font-size: 0.84rem; font-weight: 700; color: var(--text-sub); }
        .slide-counter strong { color: #fff; }
        .nav-btns { display: flex; align-items: center; gap: 8px; }
        .nav-btn {
            padding: 7px 16px; border-radius: 10px; border: 1px solid var(--border-glass);
            background: rgba(255,255,255,0.06); color: #fff; font-family: inherit; font-size: 0.82rem; font-weight: 700;
            cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: all 0.2s;
        }
        .nav-btn:hover:not(:disabled) { background: var(--mod-accent); color: #030712; border-color: var(--mod-accent); }
        .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .hint-keys { font-size: 0.74rem; color: var(--text-muted); }

        /* Speaker Notes Drawer */
        .notes-drawer {
            position: fixed; left: 50%; bottom: 66px; transform: translateX(-50%) translateY(20px);
            width: min(920px, 92vw); padding: 1.15rem 1.45rem; border-radius: 16px;
            background: rgba(7, 12, 26, 0.94); border: 1px solid color-mix(in srgb, var(--mod-accent) 50%, transparent);
            backdrop-filter: blur(20px); z-index: 120; box-shadow: 0 20px 50px rgba(0,0,0,0.65);
            opacity: 0; pointer-events: none; transition: all 0.3s var(--ease-cinematic);
        }
        .notes-drawer.open { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0); }
        .notes-head { font-size: 0.76rem; font-weight: 800; color: var(--mod-accent); margin-bottom: 6px; display: flex; justify-content: space-between; }
        .notes-body { font-size: 0.92rem; color: #E2E8F0; line-height: 1.65; }

        /* Overview Grid Modal */
        .grid-modal {
            position: fixed; inset: 0; z-index: 200; background: rgba(3, 6, 14, 0.95); backdrop-filter: blur(22px);
            padding: 2rem; overflow-y: auto; display: none;
        }
        .grid-modal.open { display: block; }
        .grid-modal-head { max-width: 1260px; margin: 0 auto 1.4rem; display: flex; justify-content: space-between; align-items: center; }
        .thumb-grid { max-width: 1260px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 0.85rem; }
        .thumb-card {
            padding: 0.9rem 1rem; border-radius: 12px; background: rgba(255,255,255,0.04); border: 1px solid var(--border-glass);
            cursor: pointer; transition: all 0.2s; text-align: left;
        }
        .thumb-card:hover, .thumb-card.current { border-color: var(--mod-accent); background: rgba(16,185,129,0.12); transform: translateY(-2px); }
        .thumb-num { font-family: 'JetBrains Mono', monospace; font-size: 0.72rem; font-weight: 800; color: var(--mod-accent); margin-bottom: 4px; }
        .thumb-title { font-size: 0.82rem; font-weight: 700; color: #fff; line-height: 1.38; }

        /* Toast */
        .toast {
            position: fixed; top: 76px; right: 20px; z-index: 250; padding: 10px 18px; border-radius: 10px;
            background: #10B981; color: #030712; font-size: 0.85rem; font-weight: 800;
            transform: translateY(-16px); opacity: 0; pointer-events: none; transition: all 0.3s;
        }
        .toast.show { transform: translateY(0); opacity: 1; }

        @media (max-width: 960px) {
            .deck-label, .hint-keys, .timer-chip { display: none; }
            .editorial-grid, .grid-2, .grid-3, .grid-4, .grid-5, .chart-layout, .ladder-grid, .check-grid, .tl-grid { grid-template-columns: 1fr; }
            .stage-viewport { overflow-y: auto; align-items: flex-start; padding-top: 1.2rem; }
            .slide-frame { max-height: none; height: auto; padding-bottom: 2rem; }
            .tl-housing { flex-direction: row; justify-content: center; }
        }
    </style>
</head>
<body>
    <!-- Ambient Cinematic Stage -->
    <div class="cinematic-stage-bg">
        <div class="ambient-orb orb-1" id="orb1"></div>
        <div class="ambient-orb orb-2" id="orb2"></div>
    </div>
    <div class="grid-overlay"></div>
    <div class="soft-vignette"></div>

    <!-- Top Navigation Bar -->
    <header class="top-bar">
        <div class="brand-left">
            <a href="showcase.html?target=public" class="back-pill"><i class="fa-solid fa-arrow-left"></i> 쇼케이스</a>
            <div class="deck-label">울산 청소년진로센터 <span>AX 시네마틱 마스터클래스</span></div>
        </div>
        <nav class="module-tabs" id="moduleTabs" aria-label="강의 모듈 선택"></nav>
        <div class="top-controls">
            <button class="timer-chip" id="timerBtn" title="60분 발표 타이머 (클릭: 시작/일시정지, 더블클릭: 리셋)">
                <i class="fa-regular fa-clock"></i> <span id="timerText">60:00</span>
            </button>
            <button class="icon-btn" id="notesBtn" title="발표자 대본 토글 (N)"><i class="fa-solid fa-microphone-lines"></i></button>
            <button class="icon-btn" id="gridBtn" title="58장 전체 개요 보기 (G)"><i class="fa-solid fa-table-cells"></i></button>
            <button class="icon-btn" id="fsBtn" title="전체화면 발표 모드 (F)"><i class="fa-solid fa-expand"></i></button>
        </div>
    </header>

    <!-- Main Cinematic Slide Viewport -->
    <main class="stage-viewport" id="stageViewport">
        <section class="slide-frame" id="slideFrame" aria-live="polite"></section>
    </main>

    <!-- Speaker Notes Drawer -->
    <aside class="notes-drawer" id="notesDrawer">
        <div class="notes-head">
            <span><i class="fa-solid fa-microphone-lines"></i> 발표자 대본 (SPEAKER NOTES)</span>
            <span id="notesTime">배정: 45초</span>
        </div>
        <div class="notes-body" id="notesBody"></div>
    </aside>

    <!-- 58-Slide Overview Modal -->
    <div class="grid-modal" id="gridModal">
        <div class="grid-modal-head">
            <div>
                <h2 style="font-size:1.35rem; font-weight:900; color:#fff;">전체 4모듈 · 58슬라이드 마스터 맵</h2>
                <p style="font-size:0.84rem; color:#94A3B8; margin-top:4px;">원하는 슬라이드를 클릭하면 시네마틱 모션과 함께 즉시 이동합니다.</p>
            </div>
            <button class="nav-btn" id="closeGridBtn"><i class="fa-solid fa-xmark"></i> 닫기 (ESC)</button>
        </div>
        <div class="thumb-grid" id="thumbGrid"></div>
    </div>

    <!-- Bottom Dock -->
    <footer class="bottom-dock">
        <div class="progress-line" id="progressLine"></div>
        <div class="slide-counter">
            <span id="modIndicator" style="color:var(--mod-accent); margin-right:8px;">M1</span>
            <strong id="curNum">01</strong> / <span id="totNum">58</span>
        </div>
        <div class="hint-keys">키보드: <b>← / → / Space</b> 이동 · <b>N</b> 대본 · <b>G</b> 전체목록 · <b>F</b> 전체화면</div>
        <div class="nav-btns">
            <button class="nav-btn" id="prevBtn"><i class="fa-solid fa-chevron-left"></i> 이전</button>
            <button class="nav-btn" id="nextBtn">다음 <i class="fa-solid fa-chevron-right"></i></button>
        </div>
    </footer>

    <div class="toast" id="toast">클립보드에 복사되었습니다!</div>

    <script src="data/ulsan-career-slides.js"></script>
    <script>
        const MODULES = window.ULSAN_CAREER_MODULES;
        const SLIDES = window.ULSAN_CAREER_SLIDES;
        const PROMPTS = window.ULSAN_CAREER_PROMPTS;

        let currentIdx = 0;
        let activeChart = null;
        let checklistState = new Array(15).fill(false);
        let simSafeMode = false;
        let tlActive = 'r';

        const CHECKLIST_ITEMS = [
            '[보안 1] 업무용 생성형 AI 계정의 모델 학습 데이터 활용 거부(Opt-out) 완료',
            '[보안 2] 상담 입력 전 실명·학교·연락처 치환(MASK-5) 규칙 적용',
            '[보안 3] 가족 경제·위기·심리·의료 등 Red 등급 민감정보 입력 원천 차단',
            '[보안 4] 만 14세 미만 프로그램 운영 시 법정대리인 동의 및 가드레일 확인',
            '[보안 5] 감정인식 AI 및 AI 단독 진로·적성 최종 판정 도구 배제',
            '[보안 6] AI 보조 리포트·안내문에 AI 활용 표시 및 상담사 검수 문구 명시',
            '[보안 7] AI 제시 학과·자격증·체험처 정보 1차 출처 30초 팩트체크 생활화',
            '[보안 8] 연 1회 이상 전 직원 생성형 AI 보안·윤리 실무 교육 이수 관리',
            '[운영 9] 정답 제공형이 아닌 소크라테스식 열린 질문 코칭 원칙 반영',
            '[운영 10] 학생이 모국어로 강점·가치관·질문을 직접 말하고 쓰는 시간 확보',
            '[운영 11] 꿈길 체험처·멘토 풀에 울산 제조 AX·AI 서비스 신직군 비중 확대',
            '[운영 12] 1회성 특강을 넘어 20h→40h 이상 오프라인 후속 성장 사다리 안내',
            '[운영 13] 5개 구·군 센터 및 교육청 센터와 검증 프롬프트·사례 정기 공유',
            '[운영 14] 학부모 대상 질문력·가정 내 진로 대화법 오프라인 워크숍 연계',
            '[운영 15] 표준화된 만족도·진로자기효능감 지표 축적 및 정책·예산 환류'
        ];

        const TL_DATA = {
            r: { title: '🔴 RED · 입력 절대 금지', color: '#F43F5E', scope: '학생 실명, 주민번호, 연락처, 얼굴사진/음성, 가족관계·경제상황, 위기·심리·의료(ADHD/우울/자해·학대) 상담 원문, 비공개 행정문서', env: '외부 상용 AI 전면 금지 (내부 폐쇄망·승인 자체 시스템 외 불가)', action: '입력 적발 시 즉시 삭제 및 보안담당자 보고 · 인간 전문상담사 오프라인 전담 처리' },
            y: { title: '🟡 YELLOW · 비식별화 후 조건부 허용', color: '#F59E0B', scope: 'MASK-5로 완전 가명·구간화한 학생 적성·흥미 프로파일, 익명화된 센터 만족도 주관식 설문 데이터, 비공개 수치 제거 기획 초안', env: '학습 거부(Opt-out) 설정 유료·기업/공공형 AI 또는 임시 채팅 모드', action: '초기 2인 교차 확인 · 출력물 하단 "AI 초안 · 상담사 검수" 표기 및 팩트체크 필수' },
            g: { title: '🟢 GREEN · 자유 활용 권장', color: '#10B981', scope: '공개된 울산 산업·고용 통계, 커리어넷·꿈길 공개 직무 정보, 일반 진로 교육 교안 아이디어, 소크라테스 공통 프롬프트 개발, 홍보 카드뉴스 초안', env: '일반 상용 생성형 AI 및 공공 권장 AI 도구', action: '저작권 및 할루시네이션(존재하지 않는 학과·자격증·법령) 최종 검증 후 배포' }
        };

        // Init Module Tabs & Overview Grid
        function initChrome() {
            const tabEl = document.getElementById('moduleTabs');
            tabEl.innerHTML = MODULES.map(m => `<button class="mod-tab" data-mod="${m.id}" onclick="jumpToSlide(${m.startIdx})">${m.code} · ${m.title}</button>`).join('');
            document.getElementById('totNum').textContent = String(SLIDES.length).padStart(2, '0');
            const thumbEl = document.getElementById('thumbGrid');
            thumbEl.innerHTML = SLIDES.map((s, idx) => `
                <button class="thumb-card" data-idx="${idx}" onclick="jumpToSlide(${idx}); toggleGrid(false);">
                    <div class="thumb-num">${s.mod} · SLIDE ${String(s.num).padStart(2,'0')} (${s.trans.toUpperCase()})</div>
                    <div class="thumb-title">${s.title.replace(/<[^>]+>/g, '')}</div>
                </button>
            `).join('');
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2200);
        }

        window.copyPrompt = function(key) {
            navigator.clipboard.writeText(PROMPTS[key] || '').then(() => showToast('프롬프트가 클립보드에 복사되었습니다!'));
        };

        window.toggleMaskSim = function() {
            simSafeMode = !simSafeMode;
            renderMaskSimulator();
        };

        function renderMaskSimulator() {
            const container = document.getElementById('maskSimContainer');
            if (!container) return;
            if (!simSafeMode) {
                container.innerHTML = `
                    <div class="sim-toggle-bar">
                        <span style="font-weight:800; color:#FDA4AF;"><i class="fa-solid fa-triangle-exclamation"></i> 현재 상태: 위험 원문 (개인정보보호법 · 국정원 가이드북 위반)</span>
                        <button class="sim-btn green" onclick="toggleMaskSim()"><i class="fa-solid fa-wand-magic-sparkles"></i> MASK-5 비식별화 모핑 실행 →</button>
                    </div>
                    <div class="sim-stage danger">
                        “<span class="pii-bad">울산 북구 매곡동</span>에 사는 <span class="pii-bad">○○고 2학년 3반 김민수(010-1234-5678)</span> 학생. 아버지가 <span class="pii-bad">현대차 협력사 구조조정 불안</span>이 있고, 학생 본인은 <span class="pii-bad">경미한 ADHD 약을 복용 중</span>임. <span class="pii-bad">내신 3.8등급</span>이고 컴퓨터 게임과 드론 조립을 좋아함. 진로 로드맵 짜줘.”
                    </div>
                `;
            } else {
                container.innerHTML = `
                    <div class="sim-toggle-bar">
                        <span style="font-weight:800; color:#6EE7B7;"><i class="fa-solid fa-shield-check"></i> 변환 완료: 안전 입력문 (모든 식별자·민감정보 제거, 진로 핵심 신호 100% 보존)</span>
                        <button class="sim-btn red" onclick="toggleMaskSim()"><i class="fa-solid fa-rotate-left"></i> 위험 원문(Before) 다시 보기</button>
                    </div>
                    <div class="sim-stage safe">
                        “<span class="pii-safe">[학생A / 울산 인문계 고2 / 중위권]</span>이 기계·드론 조립과 게임 시스템 구조 분석에 높은 흥미를 보임. 긴 이론보다 <span class="pii-safe">직접 만들고 즉각 피드백을 받는 실습형 환경에서 집중력 우수</span>. 울산 지역 미래 모빌리티·제조 AI·드론 산업과 연계하여 학생 스스로 탐색할 <span class="pii-safe">소크라테스 질문 5개와 체험 로드맵 초안</span>을 제안해 줘.”
                    </div>
                `;
            }
        }

        window.selectTraffic = function(code) {
            tlActive = code;
            renderTrafficLight();
        };

        function renderTrafficLight() {
            const box = document.getElementById('tlContainer');
            if (!box) return;
            const d = TL_DATA[tlActive];
            box.innerHTML = `
                <div class="tl-grid">
                    <div class="tl-housing">
                        <button class="tl-lamp r ${tlActive==='r'?'active':''}" onclick="selectTraffic('r')" title="Red 금지"></button>
                        <button class="tl-lamp y ${tlActive==='y'?'active':''}" onclick="selectTraffic('y')" title="Yellow 조건부 허용"></button>
                        <button class="tl-lamp g ${tlActive==='g'?'active':''}" onclick="selectTraffic('g')" title="Green 자유 활용"></button>
                    </div>
                    <div class="glass-card" style="border-color:${d.color};">
                        <h3 style="font-size:1.35rem; font-weight:900; color:${d.color}; margin-bottom:1rem;">${d.title}</h3>
                        <div class="point-stack">
                            <div class="point-row"><div><h4>대상 데이터 및 업무 범위</h4><p>${d.scope}</p></div></div>
                            <div class="point-row"><div><h4>허용 AI 환경</h4><p>${d.env}</p></div></div>
                            <div class="point-row"><div><h4>필수 실무 안전 조치</h4><p>${d.action}</p></div></div>
                        </div>
                    </div>
                </div>
            `;
        }

        window.toggleCheck = function(i) {
            checklistState[i] = !checklistState[i];
            renderChecklist();
        };

        function renderChecklist() {
            const box = document.getElementById('checklistBox');
            if (!box) return;
            const done = checklistState.filter(Boolean).length;
            const pct = Math.round((done / 15) * 100);
            box.innerHTML = `
                <div class="score-bar">
                    <span style="font-weight:800; color:#fff;">우리 센터 AX 준비도 자가 진단</span>
                    <span style="font-family:'JetBrains Mono',monospace; font-size:1.05rem; font-weight:900; color:#34D399;">${done} / 15 (${pct}%)</span>
                </div>
                <div class="check-grid">
                    ${CHECKLIST_ITEMS.map((txt, i) => `
                        <label class="check-item ${checklistState[i]?'checked':''}">
                            <input type="checkbox" ${checklistState[i]?'checked':''} onchange="toggleCheck(${i})">
                            <span>${txt}</span>
                        </label>
                    `).join('')}
                </div>
            `;
        }

        function animateCounters() {
            document.querySelectorAll('[data-count-to]').forEach(el => {
                const target = parseFloat(el.dataset.countTo);
                const suffix = el.dataset.suffix || '';
                const start = performance.now();
                const dur = 950;
                function tick(now) {
                    const p = Math.min(1, (now - start) / dur);
                    const eased = 1 - Math.pow(1 - p, 3);
                    el.textContent = Math.round(target * eased) + suffix;
                    if (p < 1) requestAnimationFrame(tick);
                }

        function renderSlide(idx, dir = 1) {
            currentIdx = Math.max(0, Math.min(SLIDES.length - 1, idx));
            const s = SLIDES[currentIdx];
            const mod = MODULES.find(m => m.id === s.mod);

            // Dynamic Module Theme Color Morphing
            document.documentElement.style.setProperty('--mod-accent', mod.accent);
            document.documentElement.style.setProperty('--mod-secondary', mod.secondary);
            document.getElementById('orb1').style.background = `radial-gradient(circle, ${mod.orb1} 0%, transparent 70%)`;
            document.getElementById('orb2').style.background = `radial-gradient(circle, ${mod.orb2} 0%, transparent 70%)`;

            // Update Tabs & Progress
            document.querySelectorAll('.mod-tab').forEach(btn => btn.classList.toggle('active', btn.dataset.mod === s.mod));
            document.querySelectorAll('.thumb-card').forEach(c => c.classList.toggle('current', Number(c.dataset.idx) === currentIdx));
            document.getElementById('curNum').textContent = String(s.num).padStart(2, '0');
            document.getElementById('modIndicator').textContent = s.mod;
            document.getElementById('progressLine').style.width = `${((currentIdx + 1) / SLIDES.length) * 100}%`;
            document.getElementById('prevBtn').disabled = currentIdx === 0;
            document.getElementById('nextBtn').disabled = currentIdx === SLIDES.length - 1;

            // Update Speaker Notes
            document.getElementById('notesBody').textContent = s.notes || '';
            document.getElementById('notesTime').textContent = `권장 발화: 약 ${s.sec}초 · 전환: ${s.trans.toUpperCase()}`;

            // Render Slide with Luis Urrutia Motion Class
            const frame = document.getElementById('slideFrame');
            frame.className = 'slide-frame';
            void frame.offsetWidth; // reflow trigger
            let animClass = 'anim-morph';
            if (s.trans === 'zoom') animClass = 'anim-zoom';
            else if (s.trans === 'push-h') animClass = dir >= 0 ? 'anim-push-next' : 'anim-push-prev';
            else if (s.trans === 'split') animClass = 'anim-split';

            frame.innerHTML = buildSlideBody(s);
            frame.classList.add(animClass);

            // Post-render interactive hooks
            animateCounters();
            mountCharts(s);
            if (s.layout === 'mask5-simulator') renderMaskSimulator();
            if (s.layout === 'traffic-light') renderTrafficLight();
            if (s.layout === 'checklist-15') renderChecklist();
        }

        window.jumpToSlide = function(idx) {
            renderSlide(idx, idx >= currentIdx ? 1 : -1);
        };

        function toggleGrid(force) {
            const m = document.getElementById('gridModal');
            const next = typeof force === 'boolean' ? force : !m.classList.contains('open');
            m.classList.toggle('open', next);
            document.getElementById('gridBtn').classList.toggle('active', next);
        }

        function toggleNotes() {
            const d = document.getElementById('notesDrawer');
            const next = !d.classList.contains('open');
            d.classList.toggle('open', next);
            document.getElementById('notesBtn').classList.toggle('active', next);
        }

        // 60-Minute Presenter Timer
        let remainSec = 3600, timerId = null;
        function updateTimerUI() {
            const m = Math.floor(remainSec / 60), sc = remainSec % 60;
            document.getElementById('timerText').textContent = `${String(m).padStart(2,'0')}:${String(sc).padStart(2,'0')}`;
        }
        document.getElementById('timerBtn').addEventListener('click', () => {
            if (timerId) { clearInterval(timerId); timerId = null; document.getElementById('timerBtn').classList.remove('running'); }
            else {
                document.getElementById('timerBtn').classList.add('running');
                timerId = setInterval(() => { if (remainSec > 0) { remainSec--; updateTimerUI(); } }, 1000);
            }
        });
        document.getElementById('timerBtn').addEventListener('dblclick', () => {
            if (timerId) { clearInterval(timerId); timerId = null; }
            remainSec = 3600; updateTimerUI(); document.getElementById('timerBtn').classList.remove('running');
        });

        // Navigation & Keyboard & Touch
        document.getElementById('prevBtn').addEventListener('click', () => renderSlide(currentIdx - 1, -1));
        document.getElementById('nextBtn').addEventListener('click', () => renderSlide(currentIdx + 1, 1));
        document.getElementById('notesBtn').addEventListener('click', toggleNotes);
        document.getElementById('gridBtn').addEventListener('click', () => toggleGrid());
        document.getElementById('closeGridBtn').addEventListener('click', () => toggleGrid(false));
        document.getElementById('fsBtn').addEventListener('click', () => {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
            else document.exitFullscreen?.();
        });

        window.addEventListener('keydown', e => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); renderSlide(currentIdx + 1, 1); }
            else if (e.key === 'ArrowLeft') { e.preventDefault(); renderSlide(currentIdx - 1, -1); }
            else if (e.key.toLowerCase() === 'n') toggleNotes();
            else if (e.key.toLowerCase() === 'g') toggleGrid();
            else if (e.key.toLowerCase() === 'f') document.getElementById('fsBtn').click();
            else if (e.key === 'Escape') toggleGrid(false);
        });

        let touchX = 0;
        document.getElementById('stageViewport').addEventListener('touchstart', e => { touchX = e.changedTouches[0].screenX; }, { passive: true });
        document.getElementById('stageViewport').addEventListener('touchend', e => {
            const dx = e.changedTouches[0].screenX - touchX;
            if (Math.abs(dx) > 55) renderSlide(currentIdx + (dx < 0 ? 1 : -1), dx < 0 ? 1 : -1);
        }, { passive: true });

        // Subtle Mouse Parallax on Ambient Orbs
        window.addEventListener('mousemove', e => {
            const rx = (e.clientX / window.innerWidth - 0.5) * 28;
            const ry = (e.clientY / window.innerHeight - 0.5) * 28;
            document.getElementById('orb1').style.transform = `translate3d(${rx}px, ${ry}px, 0)`;
            document.getElementById('orb2').style.transform = `translate3d(${-rx}px, ${-ry}px, 0)`;
        });

        initChrome();
        renderSlide(0, 1);
    </script>
</body>
</html>
