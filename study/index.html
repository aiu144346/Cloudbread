<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>중학 AI 종합 학습관 (영단어 1,800 · AI 수학 21단원 · AI 사이언스 랩) | CLOUD BREAD</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <!-- KaTeX 수식 렌더러 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
  <style>
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
    }
    .gradient-header {
      background: linear-gradient(135deg, #4f46e5 0%, #2563eb 50%, #0ea5e9 100%);
    }
    .card-shadow {
      box-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.06), 0 2px 6px -1px rgba(15, 23, 42, 0.04);
    }
    .tab-active {
      background-color: #4f46e5;
      color: #ffffff;
      font-weight: 700;
    }
    .zombie-arena-bg {
      background: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #0f172a 60%, #020617 100%);
    }
    @keyframes shakeScreen {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    .shake-effect {
      animation: shakeScreen 0.3s ease-in-out;
    }
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.6); }
      50% { box-shadow: 0 0 18px 4px rgba(239, 68, 68, 0.85); }
    }
    .priority-target-glow {
      animation: pulseGlow 1.1s infinite;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- 상단 네비게이션 바 -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3 cursor-pointer" onclick="app.goHome()">
        <div class="w-10 h-10 rounded-xl gradient-header flex items-center justify-center text-white font-extrabold text-xl shadow-sm">
          V9
        </div>
        <div>
          <div class="flex items-center gap-2">
            <span class="font-extrabold text-lg tracking-tight text-slate-900">중학 영단어 9레벨 마스터</span>
            <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-indigo-50 text-indigo-700 border border-indigo-200">교육부 필수 1,800단어</span>
          </div>
          <p class="text-xs text-slate-500 hidden sm:block">중1~중3 1,800단어 완벽 구축 · 9레벨 자동 큐레이션 · 4지선다 좀비 디펜스 · AI 4대 암기 비법</p>
        </div>
      </div>

      <!-- 로그인 후 메뉴 탭 -->
      <nav id="mainNav" class="hidden md:flex items-center gap-1 bg-slate-100 p-1 rounded-xl">
        <button data-tab="dashboard" onclick="app.switchTab('dashboard')" class="nav-btn px-3 py-1.5 rounded-lg text-xs lg:text-sm font-medium text-slate-600 hover:text-slate-900 transition">
          📊 대시보드
        </button>
        <button data-tab="zombie" onclick="app.switchTab('zombie')" class="nav-btn px-3 py-1.5 rounded-lg text-xs lg:text-sm font-extrabold text-emerald-700 bg-emerald-50 hover:bg-emerald-100 transition">
          🧟 좀비 단어 디펜스
        </button>
        <button data-tab="math" onclick="app.switchTab('math')" class="nav-btn px-3 py-1.5 rounded-lg text-xs lg:text-sm font-extrabold text-blue-700 bg-blue-50 hover:bg-blue-100 transition">
          📐 AI 수학(수포자 탈출)
        </button>
        <button data-tab="science" onclick="app.switchTab('science')" class="nav-btn px-3 py-1.5 rounded-lg text-xs lg:text-sm font-extrabold text-cyan-700 bg-cyan-50 hover:bg-cyan-100 transition">
          🔬 AI 사이언스 랩
        </button>
        <button data-tab="ailab" onclick="app.switchTab('ailab')" class="nav-btn px-3 py-1.5 rounded-lg text-xs lg:text-sm font-bold text-purple-700 bg-purple-50 hover:bg-purple-100 transition">
          🤖 AI 4대 암기비법
        </button>
        <button data-tab="study" onclick="app.switchTab('study')" class="nav-btn px-3 py-1.5 rounded-lg text-xs lg:text-sm font-medium text-slate-600 hover:text-slate-900 transition">
          🧠 4단계 학습
        </button>
        <button data-tab="planner" onclick="app.switchTab('planner')" class="nav-btn px-3 py-1.5 rounded-lg text-xs lg:text-sm font-medium text-slate-600 hover:text-slate-900 transition">
          📅 공부 플랜
        </button>
        <button data-tab="leveltest" onclick="app.switchTab('leveltest')" class="nav-btn px-3 py-1.5 rounded-lg text-xs lg:text-sm font-medium text-slate-600 hover:text-slate-900 transition">
          🎯 레벨테스트
        </button>
        <button data-tab="wordbook" onclick="app.switchTab('wordbook')" class="nav-btn px-3 py-1.5 rounded-lg text-xs lg:text-sm font-medium text-slate-600 hover:text-slate-900 transition">
          📚 9레벨 단어장
        </button>
        <button id="adminTabBtn" data-tab="admin" onclick="app.switchTab('admin')" class="nav-btn hidden px-3 py-1.5 rounded-lg text-xs lg:text-sm font-medium text-amber-700 bg-amber-50 hover:bg-amber-100 transition">
          👩‍🏫 학생관리
        </button>
      </nav>

      <!-- 우측 사용자 상태 표시 -->
      <div id="userHeaderArea" class="hidden items-center gap-3">
        <a href="/showcase.html?target=senior" class="text-xs font-bold px-3 py-1.5 rounded-lg border border-slate-200 bg-slate-50 text-slate-700 hover:bg-slate-100 transition flex items-center gap-1">
          <span>←</span><span class="hidden sm:inline">쇼케이스</span><span>복귀</span>
        </a>
        <div class="text-right">
          <div class="flex items-center justify-end gap-1.5">
            <span id="headerUserName" class="text-sm font-bold text-slate-800"></span>
            <span id="headerUserLevelBadge" class="text-xs font-bold px-2 py-0.5 rounded-md bg-indigo-600 text-white"></span>
          </div>
          <p id="headerUserId" class="text-xs text-slate-500"></p>
        </div>
        <button onclick="app.logout()" class="text-xs font-semibold px-3 py-2 rounded-lg border border-slate-200 text-slate-600 hover:bg-slate-100 transition">
          로그아웃
        </button>
      </div>
    </div>

    <!-- 모바일 하단/보조 탭바 -->
    <div id="mobileNav" class="hidden md:hidden border-t border-slate-100 px-2 py-1.5 bg-slate-50 flex overflow-x-auto gap-1">
      <button data-tab="dashboard" onclick="app.switchTab('dashboard')" class="nav-btn whitespace-nowrap px-3 py-1.5 rounded-lg text-xs font-medium text-slate-600">📊 대시보드</button>
      <button data-tab="zombie" onclick="app.switchTab('zombie')" class="nav-btn whitespace-nowrap px-3 py-1.5 rounded-lg text-xs font-extrabold text-emerald-700 bg-emerald-50">🧟 좀비디펜스</button>
      <button data-tab="math" onclick="app.switchTab('math')" class="nav-btn whitespace-nowrap px-3 py-1.5 rounded-lg text-xs font-extrabold text-blue-700 bg-blue-50">📐 AI수학</button>
      <button data-tab="science" onclick="app.switchTab('science')" class="nav-btn whitespace-nowrap px-3 py-1.5 rounded-lg text-xs font-extrabold text-cyan-700 bg-cyan-50">🔬 AI사이언스</button>
      <button data-tab="ailab" onclick="app.switchTab('ailab')" class="nav-btn whitespace-nowrap px-3 py-1.5 rounded-lg text-xs font-bold text-purple-700 bg-purple-50">🤖 AI암기비법</button>
      <button data-tab="study" onclick="app.switchTab('study')" class="nav-btn whitespace-nowrap px-3 py-1.5 rounded-lg text-xs font-medium text-slate-600">🧠 4단계학습</button>
      <button data-tab="planner" onclick="app.switchTab('planner')" class="nav-btn whitespace-nowrap px-3 py-1.5 rounded-lg text-xs font-medium text-slate-600">📅 공부플랜</button>
      <button data-tab="leveltest" onclick="app.switchTab('leveltest')" class="nav-btn whitespace-nowrap px-3 py-1.5 rounded-lg text-xs font-medium text-slate-600">🎯 레벨테스트</button>
      <button data-tab="wordbook" onclick="app.switchTab('wordbook')" class="nav-btn whitespace-nowrap px-3 py-1.5 rounded-lg text-xs font-medium text-slate-600">📚 9레벨단어장</button>
      <button id="mobileAdminTabBtn" data-tab="admin" onclick="app.switchTab('admin')" class="nav-btn hidden whitespace-nowrap px-3 py-1.5 rounded-lg text-xs font-medium text-amber-700">👩‍🏫 학생관리</button>
    </div>
  </header>

  <!-- 알림 토스트 -->
  <div id="toastBox" class="fixed bottom-5 right-5 z-50 hidden max-w-sm bg-slate-900 text-white px-4 py-3 rounded-xl shadow-lg text-sm font-medium flex items-center gap-2">
    <span id="toastMessage"></span>
  </div>

  <!-- 메인 컨텐츠 컨테이너 -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
    <div id="appRoot"></div>
  </main>

  <!-- 푸터 -->
  <footer class="bg-white border-t border-slate-200 py-4 mt-12">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between text-xs text-slate-500 gap-2">
      <div>🎓 대한민국 중학교 1~3학년 교육과정 필수 1,800 영단어 9레벨 맞춤형 학습 플랫폼</div>
      <div>플러그인형 단어 암기 엔진 탑재 (4지선다 좀비 디펜스 · AI 4대 암기비법 전 단어 연동)</div>
    </div>
  </footer>

  <script src="client-api.js"></script>
  <script src="app.js"></script>
</body>
</html>
